<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講義ノートAI - 音声文字起こし＆要約</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold text-slate-900 flex items-center gap-2">
        <span>🎙️</span> 講義ノートAI
      </h1>
      <!-- APIキー設定ボタン -->
      <button id="apiKeyBtn" type="button" class="text-xs px-3 py-1.5 rounded-full border border-slate-300 hover:bg-slate-100 flex items-center gap-1.5 transition cursor-pointer">
        <span id="apiKeyStatusIcon" class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span id="apiKeyStatusText">APIキー未設定</span>
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-6 space-y-6">

    <!-- APIキー入力モーダル -->
    <div id="apiModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
        <h2 class="text-base font-bold text-slate-900">Gemini APIキーの設定</h2>
        <p class="text-xs text-slate-500 leading-relaxed">
          Google AI Studioで取得したAPIキーを入力してください。キーはブラウザ（localStorage）にのみ保存されます。
        </p>
        <div>
          <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button id="closeModalBtn" type="button" class="text-xs px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">キャンセル</button>
          <button id="saveKeyBtn" type="button" class="text-xs px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存する</button>
        </div>
      </div>
    </div>

    <!-- 講義情報入力 -->
    <section class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">講義名（任意）</label>
      <input type="text" id="lectureTitle" placeholder="例: 経済学入門 第5回" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </section>

    <!-- 音声入力セクション -->
    <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
      <h2 class="text-sm font-bold text-slate-900">音声データの読み込み</h2>
      
      <!-- ファイル選択 -->
      <div>
        <label class="block text-xs text-slate-500 mb-1">音声ファイルを選択（短めのMP3, M4A, WAV等）</label>
        <input type="file" id="audioFileInput" accept="audio/*" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-slate-200 rounded-lg">
      </div>

      <!-- 音声プレイヤー -->
      <div id="audioPreviewContainer" class="hidden pt-2 border-t border-slate-100">
        <p class="text-xs text-slate-500 mb-2">選択した音声のプレビュー:</p>
        <audio id="audioPlayer" controls class="w-full h-10 rounded-lg"></audio>
      </div>
    </section>

    <!-- 実行ボタン & ローディング表示 -->
    <div class="space-y-3">
      <button id="runBtn" type="button" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-sm font-bold rounded-xl shadow-sm hover:shadow transition flex items-center justify-center gap-2 cursor-pointer disabled:bg-slate-300 disabled:cursor-not-allowed">
        <span id="runBtnText">✨ 文字起こし＆要約を実行</span>
      </button>

      <!-- エラー表示枠 -->
      <div id="errorAlert" class="hidden p-4 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 font-medium"></div>
    </div>

    <!-- 結果表示エリア -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <!-- タブ切り替え -->
      <div class="flex border-b border-slate-200 bg-slate-50/50">
        <button id="tabSummaryBtn" type="button" class="flex-1 py-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition">
          📊 要約 & 要点
        </button>
        <button id="tabTranscriptBtn" type="button" class="flex-1 py-3 text-xs font-bold text-slate-500 hover:text-slate-800 transition">
          📝 全文文字起こし
        </button>
      </div>

      <div class="p-5">
        <!-- タブ1: 要約 & 要点 -->
        <div id="summaryContent" class="space-y-5">
          <div>
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">3行要約</h3>
              <button id="copySummaryBtn" type="button" class="text-xs text-indigo-600 hover:underline hidden">要約をコピー</button>
            </div>
            <div id="summaryText" class="text-xs text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-100 leading-relaxed whitespace-pre-line">
              音声ファイルを選択して実行してください。
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">主要ポイント (3〜5個)</h3>
            </div>
            <div id="keyPointsText" class="text-xs text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-100 leading-relaxed whitespace-pre-line">
              -
            </div>
          </div>
        </div>

        <!-- タブ2: 全文文字起こし -->
        <div id="transcriptContent" class="hidden space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">全文テキスト</h3>
            <button id="copyTranscriptBtn" type="button" class="text-xs text-indigo-600 hover:underline hidden">全文をコピー</button>
          </div>
          <div id="transcriptText" class="text-xs text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-100 leading-relaxed whitespace-pre-line max-h-96 overflow-y-auto">
            -
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- DOM要素 ---
      const apiKeyBtn = document.getElementById('apiKeyBtn');
      const apiKeyStatusIcon = document.getElementById('apiKeyStatusIcon');
      const apiKeyStatusText = document.getElementById('apiKeyStatusText');
      const apiModal = document.getElementById('apiModal');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const saveKeyBtn = document.getElementById('saveKeyBtn');
      const audioFileInput = document.getElementById('audioFileInput');
      const audioPreviewContainer = document.getElementById('audioPreviewContainer');
      const audioPlayer = document.getElementById('audioPlayer');
      const runBtn = document.getElementById('runBtn');
      const runBtnText = document.getElementById('runBtnText');
      const errorAlert = document.getElementById('errorAlert');

      const tabSummaryBtn = document.getElementById('tabSummaryBtn');
      const tabTranscriptBtn = document.getElementById('tabTranscriptBtn');
      const summaryContent = document.getElementById('summaryContent');
      const transcriptContent = document.getElementById('transcriptContent');

      const summaryText = document.getElementById('summaryText');
      const keyPointsText = document.getElementById('keyPointsText');
      const transcriptText = document.getElementById('transcriptText');
      const copySummaryBtn = document.getElementById('copySummaryBtn');
      const copyTranscriptBtn = document.getElementById('copyTranscriptBtn');

      // --- APIキー管理 ---
      function updateKeyStatus() {
        const key = localStorage.getItem('gemini_api_key');
        if (key && key.trim() !== '') {
          apiKeyStatusIcon.className = 'w-2 h-2 rounded-full bg-emerald-500';
          apiKeyStatusText.textContent = 'APIキー設定済み';
          apiKeyStatusText.className = 'text-emerald-700 font-medium';
        } else {
          apiKeyStatusIcon.className = 'w-2 h-2 rounded-full bg-rose-500';
          apiKeyStatusText.textContent = 'APIキー未設定';
          apiKeyStatusText.className = 'text-rose-600 font-medium';
        }
      }

      apiKeyBtn.addEventListener('click', () => {
        apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
        apiModal.classList.remove('hidden');
      });

      closeModalBtn.addEventListener('click', () => apiModal.classList.add('hidden'));

      saveKeyBtn.addEventListener('click', () => {
        const val = apiKeyInput.value.trim();
        if (val) localStorage.setItem('gemini_api_key', val);
        else localStorage.removeItem('gemini_api_key');
        updateKeyStatus();
        apiModal.classList.add('hidden');
      });

      // --- 音声プレビュー ---
      audioFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          audioPlayer.src = URL.createObjectURL(file);
          audioPreviewContainer.classList.remove('hidden');
        } else {
          audioPreviewContainer.classList.add('hidden');
          audioPlayer.src = '';
        }
      });

      // --- タブ切り替え ---
      tabSummaryBtn.addEventListener('click', () => {
        summaryContent.classList.remove('hidden');
        transcriptContent.classList.add('hidden');
        tabSummaryBtn.className = 'flex-1 py-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition';
        tabTranscriptBtn.className = 'flex-1 py-3 text-xs font-bold text-slate-500 hover:text-slate-800 transition';
      });

      tabTranscriptBtn.addEventListener('click', () => {
        transcriptContent.classList.remove('hidden');
        summaryContent.classList.add('hidden');
        tabTranscriptBtn.className = 'flex-1 py-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition';
        tabSummaryBtn.className = 'flex-1 py-3 text-xs font-bold text-slate-500 hover:text-slate-800 transition';
      });

      // --- 音声ファイルをBase64に変換 ---
      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = (error) => reject(error);
          reader.readAsDataURL(file);
        });
      }

      // --- コピー機能 ---
      function setupCopyBtn(btn, getTextFn) {
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(getTextFn());
            const origText = btn.textContent;
            btn.textContent = 'コピーしました！';
            setTimeout(() => btn.textContent = origText, 2000);
          } catch (err) {
            alert('コピーに失敗しました');
          }
        });
      }
      setupCopyBtn(copySummaryBtn, () => `【3行要約】\n${summaryText.textContent}\n\n【主要ポイント】\n${keyPointsText.textContent}`);
      setupCopyBtn(copyTranscriptBtn, () => transcriptText.textContent);

      // --- API実行メインロジック ---
      runBtn.addEventListener('click', async () => {
        errorAlert.classList.add('hidden');
        
        const apiKey = localStorage.getItem('gemini_api_key');
        if (!apiKey) {
          alert('先にAPIキーを設定してください（右上のボタンから入力できます）。');
          apiModal.classList.remove('hidden');
          return;
        }

        const file = audioFileInput.files[0];
        if (!file) {
          alert('音声ファイルを選択してください。');
          return;
        }

        // 処理中表示への変更
        runBtn.disabled = true;
        runBtnText.textContent = '⏳ 音声を解析中...（数十秒かかります）';

        try {
          const base64Data = await fileToBase64(file);
          let mimeType = file.type || 'audio/mp3';
          if (mimeType.includes('m4a') || mimeType.includes('mp4')) mimeType = 'audio/m4a';

          const prompt = `以下の音声を聞き、指示に従って出力してください。

【指示】
1. 講義の内容を全文章で正確に文字起こししてください。
2. 全体の要約を3行でまとめてください。
3. 最も重要なポイントを3〜5個の箇条書きで抽出してください。

【出力フォーマット】
---3行要約---
(ここに3行要約)

---主要ポイント---
・(ポイント1)
・(ポイント2)
・(ポイント3)

---全文文字起こし---
(ここに文字起こしテキスト)`;

          // エンドポイント (gemini-2.5-flash)
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
          
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  {
                    inlineData: {
                      mimeType: mimeType,
                      data: base64Data
                    }
                  },
                  { text: prompt }
                ]
              }]
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error?.message || `APIエラー (Status: ${response.status})`);
          }

          const fullText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!fullText) throw new Error('APIからの返答が空でした。');

          // テキストパース
          let partsSummary = "";
          let partsPoints = "";
          let partsTranscript = "";

          if (fullText.includes('---3行要約---')) {
            const split1 = fullText.split('---3行要約---')[1] || "";
            const split2 = split1.split('---主要ポイント---');
            partsSummary = split2[0] || "";

            if (split2[1]) {
              const split3 = split2[1].split('---全文文字起こし---');
              partsPoints = split3[0] || "";
              partsTranscript = split3[1] || "";
            }
          } else {
            partsSummary = fullText;
          }

          summaryText.textContent = partsSummary.trim() || '要約の生成が完了しました。';
          keyPointsText.textContent = partsPoints.trim() || '-';
          transcriptText.textContent = (partsTranscript || fullText).trim();

          copySummaryBtn.classList.remove('hidden');
          copyTranscriptBtn.classList.remove('hidden');

        } catch (err) {
          console.error(err);
          errorAlert.textContent = `エラーが発生しました: ${err.message}`;
          errorAlert.classList.remove('hidden');
        } finally {
          runBtn.disabled = false;
          runBtnText.textContent = '✨ 文字起こし＆要約を実行';
        }
      });

      // 初期状態の反映
      updateKeyStatus();
    });
  </script>
</body>
</html>
